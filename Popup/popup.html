
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="top-box">
    <h1>Custom skins activation</h1>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <h2>Choose skin</h2>

  <div class="set festive disabled" data-skin="set2">
    <button title="Festive Classic">Festive Classic</button>
    <div class="preview dark">
      <img src="../assets/Set2/wk.png" title="Festive Classic">
      <img src="../assets/Set2/wq.png" title="Festive Classic">
      <img src="../assets/Set2/wr.png" title="Festive Classic">
      <img src="../assets/Set2/wb.png" title="Festive Classic">
      <img src="../assets/Set2/wn.png" title="Festive Classic">
      <img src="../assets/Set2/wp.png" title="Festive Classic">

      <img src="../assets/Set2/bk.png" title="Festive Classic">
      <img src="../assets/Set2/bq.png" title="Festive Classic">
      <img src="../assets/Set2/br.png" title="Festive Classic">
      <img src="../assets/Set2/bb.png" title="Festive Classic">
      <img src="../assets/Set2/bn.png" title="Festive Classic">
      <img src="../assets/Set2/bp.png" title="Festive Classic">
    </div>
  </div>

  <h2>Choose glow + color effect</h2>

  <div class="set disabled" data-effect="native-ember" data-preview="wk">
    <button title="Ember Glow">Ember Glow</button>
    <div class="preview light preview-ember">
      <img src="../assets/Set2/wk.png" title="Ember Glow" />
    </div>
  </div>

  <div class="set disabled" data-effect="native-frost" data-preview="wk">
    <button title="Frost Aura">Frost Aura</button>
    <div class="preview light preview-frost">
      <img src="../assets/Set2/wk.png" title="Frost Aura" />
    </div>
  </div>

  <div class="set disabled" data-effect="native-neon" data-preview="wk">
    <button title="Neon Pulse">Neon Pulse</button>
    <div class="preview light preview-neon">
      <img src="../assets/Set2/wk.png" title="Neon Pulse" />
    </div>
  </div>

  <div class="set disabled" data-effect="legendary-ember" data-preview="wk">
    <button title="Legendary Ember">Legendary Ember</button>
    <div class="preview light preview-legendary">
      <img src="../assets/Set2/wk.png" title="Legendary Ember" />
    </div>
  </div>

  <div class="set disabled" data-effect="minimal" data-preview="wk">
    <button title="Minimal Halo">Minimal Halo</button>
    <div class="preview light preview-minimal">
      <img src="../assets/Set2/wk.png" title="Minimal Halo" />
    </div>
  </div>

  <h2>Glow target</h2>

  <div class="set disabled" data-target="all">
    <button>All pieces</button>
  </div>

  <div class="set disabled" data-target="royal">
    <button>Only king + queen</button>
  </div>

<script src="popup.js"></script>
</body>
</html>
