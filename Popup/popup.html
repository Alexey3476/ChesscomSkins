
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="top-box">
    <h1>Custom skins activation</h1>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <h2>Choose skin</h2>

  <div id="skin-list" class="skin-list"></div>

  <h2>Choose glow + color effect</h2>

  <div class="effect-preview light" id="effect-preview">
    <img id="effect-preview-img" src="../assets/Set2/wk.png" title="Glow preview" />
    <span id="effect-preview-label">Glow preview</span>
  </div>

  <div id="effect-list" class="effect-list">
    <button class="set disabled" data-effect="native-ember" title="Ember Glow">Ember Glow</button>
    <button class="set disabled" data-effect="native-frost" title="Frost Aura">Frost Aura</button>
    <button class="set disabled" data-effect="native-neon" title="Neon Pulse">Neon Pulse</button>
    <button class="set disabled" data-effect="legendary-ember" title="Legendary Ember">Legendary Ember</button>
    <button class="set disabled" data-effect="minimal" title="Minimal Halo">Minimal Halo</button>
  </div>

  <h2>Glow target</h2>

  <div class="set disabled" data-target="all">
    <button>All pieces</button>
  </div>

  <div class="set disabled" data-target="royal">
    <button>Only king + queen</button>
  </div>

<script src="popup.js"></script>
</body>
</html>
