
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="top-box">
    <h1>Custom skins activation</h1>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <h2>Choose skin</h2>

  <div class="set festive disabled" data-skin="set2">
    <button>Festive Classic</button>
    <div class="preview dark">
      <img src="../assets/Set2/wk.png">
      <img src="../assets/Set2/wq.png">
      <img src="../assets/Set2/wr.png">
      <img src="../assets/Set2/wb.png">
      <img src="../assets/Set2/wn.png">
      <img src="../assets/Set2/wp.png">

      <img src="../assets/Set2/bk.png">
      <img src="../assets/Set2/bq.png">
      <img src="../assets/Set2/br.png">
      <img src="../assets/Set2/bb.png">
      <img src="../assets/Set2/bn.png">
      <img src="../assets/Set2/bp.png">
    </div>
  </div>

  <div class="set disabled" data-skin="none">
    <button>Original (no skin)</button>
    <div class="preview light preview-neutral">
      <img src="../assets/Set2/wq.png" />
    </div>
  </div>

  <h2>Choose glow + color effect</h2>

  <div class="set disabled" data-effect="native-ember" data-preview="wq">
    <button>Ember Glow</button>
    <div class="preview light preview-ember">
      <img src="../assets/Set2/wq.png" />
    </div>
  </div>

  <div class="set disabled" data-effect="native-frost" data-preview="wq">
    <button>Frost Aura</button>
    <div class="preview light preview-frost">
      <img src="../assets/Set2/wq.png" />
    </div>
  </div>

  <div class="set disabled" data-effect="native-neon" data-preview="wq">
    <button>Neon Pulse</button>
    <div class="preview light preview-neon">
      <img src="../assets/Set2/wq.png" />
    </div>
  </div>

  <div class="set disabled" data-effect="legendary-ember" data-preview="wk wq bk bq">
    <button>Legendary Ember</button>
    <div class="preview light preview-legendary">
      <img src="../assets/Set2/wk.png" />
      <img src="../assets/Set2/wq.png" />
      <img src="../assets/Set2/bk.png" />
      <img src="../assets/Set2/bq.png" />
    </div>
  </div>

  <div class="set disabled" data-effect="minimal" data-preview="wq">
    <button>Minimal Halo</button>
    <div class="preview light preview-minimal">
      <img src="../assets/Set2/wq.png" />
    </div>
  </div>

  <div class="set disabled" data-effect="none" data-preview="wq">
    <button>No glow / no color</button>
    <div class="preview light preview-neutral">
      <img src="../assets/Set2/wq.png" />
    </div>
  </div>

  <h2>Glow target</h2>

  <div class="set disabled" data-target="all">
    <button>All pieces</button>
  </div>

  <div class="set disabled" data-target="royal">
    <button>Only king + queen</button>
  </div>

<script src="popup.js"></script>
</body>
</html>
